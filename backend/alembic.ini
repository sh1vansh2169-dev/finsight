# Alembic CLI configuration, for creating new migrations during development:
#   ..\.venv\Scripts\alembic.exe -c backend\alembic.ini revision --autogenerate -m "describe change"
# The app applies migrations itself on startup (moneyos.db.session.migrate).
# Database URL: MONEYOS_DATABASE_URL, else the value below.

[alembic]
script_location = %(here)s/src/moneyos/db/migrations
sqlalchemy.url = sqlite:///data/moneyos.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
